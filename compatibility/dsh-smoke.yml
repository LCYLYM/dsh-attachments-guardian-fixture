schema: 1
requires_model_turn: true
model_turn_scope: candidate-only
fixture_mode: none
model_smoke:
  input_mode: text
  prompt: >-
    This is a pure-text DSH compatibility smoke. First call the safe read-only
    `read` tool with {"path":"package.json"}. After the tool result, reply in
    one short sentence with a concrete fact from that file. You must invoke a
    tool before replying, and the final response must be non-empty.
  required_event_types:
    - user/message
    - tool/call
    - tool/result
    - assistant/message
    - turn/end
web:
  ready:
    path: /
    timeout_seconds: 120
  assertions:
    - id: plugin-health
      method: GET
      path: /community-multimedia-webui-input/v1/health
      status: 200
      json_subset:
        ok: true
        plugin: dsh-multimedia-webui-input
