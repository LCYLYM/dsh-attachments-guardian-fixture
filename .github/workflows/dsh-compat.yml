name: DSH compatibility guardian

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dsh-compat.yml
      - .dsh-compat.lock.json
      - compatibility/dsh-smoke.yml
      - .github/workflows/dsh-compat.yml

permissions:
  contents: read

jobs:
  guardian:
    # Guardian 0.1.0-dev.0 full campaign workflow; only change this SHA during an explicit upgrade.
    uses: LCYLYM/dsh-plugin-compat-guardian/.github/workflows/guardian.yml@e1617b2c1b418b9982c5f6ccdc9a9a02d0514fe0
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: LCYLYM/dsh-plugin-compat-guardian
      guardian_ref: e1617b2c1b418b9982c5f6ccdc9a9a02d0514fe0
      runner: ubuntu-24.04
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
      publisher_token: ${{ secrets.DSH_GUARDIAN_PUBLISH_TOKEN }}
      email_gateway_url: ${{ secrets.GUARDIAN_EMAIL_GATEWAY_URL }}
      telegram_bot_token: ${{ secrets.GUARDIAN_TELEGRAM_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.GUARDIAN_TELEGRAM_CHAT_ID }}
      notification_webhook_url: ${{ secrets.GUARDIAN_WEBHOOK_URL }}
