name: DSH compatibility guardian

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dsh-compat.yml
      - .dsh-compat.lock.json
      - compatibility/dsh-smoke.yml

permissions:
  contents: read

jobs:
  guardian:
    # Guardian 0.1.0-dev.0 + CI identity fix; only change this SHA during an explicit upgrade.
    uses: LCYLYM/dsh-plugin-compat-guardian/.github/workflows/guardian.yml@d0aea35778a8a0ae888c3dddc2564572c3022906
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: LCYLYM/dsh-plugin-compat-guardian
      guardian_ref: d0aea35778a8a0ae888c3dddc2564572c3022906
      runner: ubuntu-24.04
