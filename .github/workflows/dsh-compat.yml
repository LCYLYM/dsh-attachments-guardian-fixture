name: DSH compatibility guardian

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dsh-compat.yml
      - .dsh-compat.lock.json
      - compatibility/dsh-smoke.yml

permissions:
  contents: read

jobs:
  guardian:
    # Guardian 0.1.0-dev.0; only change this full SHA during an explicit engine upgrade.
    uses: LCYLYM/dsh-plugin-compat-guardian/.github/workflows/guardian.yml@6c438e407ff350fc7b6dc1e7253adfb8fac06edd
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: LCYLYM/dsh-plugin-compat-guardian
      guardian_ref: 6c438e407ff350fc7b6dc1e7253adfb8fac06edd
      runner: ubuntu-24.04
